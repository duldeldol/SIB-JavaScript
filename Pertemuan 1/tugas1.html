<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 1 - Menghitung Luas Bangun Datar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
            padding: 30px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 24px;
            color: #1a202c;
            margin-bottom: 8px;
        }

        header p {
            color: #64748b;
            font-size: 14px;
        }

        .card-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
            border-top: 4px solid #3b82f6;
        }

        .card.persegi-panjang {
            border-top-color: #10b981;
        }

        .card.segitiga {
            border-top-color: #f59e0b;
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #1f2937;
        }

        .rumus {
            background-color: #f8fafc;
            border-left: 3px solid #cbd5e1;
            padding: 6px 10px;
            font-size: 13px;
            color: #475569;
            margin-bottom: 14px;
            font-style: italic;
        }

        .info-nilai {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #374151;
        }

        .hasil-box {
            background-color: #eff6ff;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
        }

        .hasil-box span {
            display: block;
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .hasil-box strong {
            font-size: 20px;
            color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Tugas 1 - Javascript</h1>
            <p>Perhitungan Luas Bangun Datar menggunakan Variabel dan Operator</p>
        </header>

        <div class="card-list">
            <!-- Kartu Bujur Sangkar -->
            <div class="card bujur-sangkar">
                <h2>Bujur Sangkar</h2>
                <div class="rumus">Rumus: sisi × sisi</div>
                <div class="info-nilai" id="info-bujur-sangkar"></div>
                <div class="hasil-box">
                    <span>Hasil Luas:</span>
                    <strong id="hasil-bujur-sangkar">-</strong>
                </div>
            </div>

            <!-- Kartu Persegi Panjang -->
            <div class="card persegi-panjang">
                <h2>Persegi Panjang</h2>
                <div class="rumus">Rumus: panjang × lebar</div>
                <div class="info-nilai" id="info-persegi-panjang"></div>
                <div class="hasil-box">
                    <span>Hasil Luas:</span>
                    <strong id="hasil-persegi-panjang">-</strong>
                </div>
            </div>

            <!-- Kartu Segitiga -->
            <div class="card segitiga">
                <h2>Segitiga</h2>
                <div class="rumus">Rumus: 0.5 × alas × tinggi</div>
                <div class="info-nilai" id="info-segitiga"></div>
                <div class="hasil-box">
                    <span>Hasil Luas:</span>
                    <strong id="hasil-segitiga">-</strong>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. FUNGSI MENGHITUNG LUAS BUJUR SANGKAR
        // Menerima nilai sisi, lalu dikalikan dengan sisi itu sendiri
        function hitungLuasBujurSangkar(sisi) {
            let luas = sisi * sisi;
            return luas;
        }

        // 2. FUNGSI MENGHITUNG LUAS PERSEGI PANJANG
        // Menerima nilai panjang dan lebar, lalu dikalikan
        function hitungLuasPersegiPanjang(panjang, lebar) {
            let luas = panjang * lebar;
            return luas;
        }

        // 3. FUNGSI MENGHITUNG LUAS SEGITIGA
        // Menerima nilai alas dan tinggi, rumus: (1/2 atau 0.5) * alas * tinggi
        function hitungLuasSegitiga(alas, tinggi) {
            let luas = 0.5 * alas * tinggi;
            return luas;
        }

        // MENENTUKAN NILAI VARIABEL (Bebas)
        // Nilai untuk bujur sangkar
        let sisiPersegi = 6;

        // Nilai untuk persegi panjang
        let panjangPersegiPanjang = 10;
        let lebarPersegiPanjang = 5;

        // Nilai untuk segitiga
        let alasSegitiga = 8;
        let tinggiSegitiga = 12;

        // PROSES PERHITUNGAN (Panggil Fungsi)
        let luasBujurSangkar = hitungLuasBujurSangkar(sisiPersegi);
        let luasPersegiPanjang = hitungLuasPersegiPanjang(panjangPersegiPanjang, lebarPersegiPanjang);
        let luasSegitiga = hitungLuasSegitiga(alasSegitiga, tinggiSegitiga);

        // MENAMPILKAN HASIL KE CONSOLE
        console.log("=== HASIL PERHITUNGAN LUAS BANGUN DATAR ===");
        console.log("1. Bujur Sangkar -> Sisi: " + sisiPersegi + " | Luas: " + luasBujurSangkar);
        console.log("2. Persegi Panjang -> Panjang: " + panjangPersegiPanjang + ", Lebar: " + lebarPersegiPanjang + " | Luas: " + luasPersegiPanjang);
        console.log("3. Segitiga -> Alas: " + alasSegitiga + ", Tinggi: " + tinggiSegitiga + " | Luas: " + luasSegitiga);

        // MENAMPILKAN HASIL KE HALAMAN HTML
        // Bujur Sangkar
        document.getElementById("info-bujur-sangkar").innerHTML = "Sisi = " + sisiPersegi;
        document.getElementById("hasil-bujur-sangkar").innerText = luasBujurSangkar;

        // Persegi Panjang
        document.getElementById("info-persegi-panjang").innerHTML = "Panjang = " + panjangPersegiPanjang + "<br>Lebar = " + lebarPersegiPanjang;
        document.getElementById("hasil-persegi-panjang").innerText = luasPersegiPanjang;

        // Segitiga
        document.getElementById("info-segitiga").innerHTML = "Alas = " + alasSegitiga + "<br>Tinggi = " + tinggiSegitiga;
        document.getElementById("hasil-segitiga").innerText = luasSegitiga;
    </script>
</body>
</html>
